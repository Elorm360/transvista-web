name: AI planner build diagnosis

on:
  push:
    branches: [feature/ai-trip-planner]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://peowpouawnunvvzydhdn.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-build-key
